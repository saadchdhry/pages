<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PiP Clock social preview</title>
  <desc id="desc">Preview image for PiP Clock, a minimal fullscreen analog clock for Picture-in-Picture workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f3"/>
      <stop offset="100%" stop-color="#e9e7df"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="265" cy="315" r="180" fill="none" stroke="#111111" stroke-width="20"/>
  <line x1="265" y1="315" x2="265" y2="205" stroke="#111111" stroke-width="24" stroke-linecap="round"/>
  <line x1="265" y1="315" x2="350" y2="315" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <circle cx="265" cy="315" r="14" fill="#111111"/>
