  <line x1="265" y1="458" x2="265" y2="485" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="95" y1="315" x2="122" y2="315" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="408" y1="315" x2="435" y2="315" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
