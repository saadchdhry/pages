<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#8212;</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    const savedThemeMode = localStorage.getItem('themeMode');
    if (savedThemeMode === 'dark' || savedThemeMode === 'light') {
      document.documentElement.setAttribute('data-theme', savedThemeMode);
    }
  </script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
      --bg-color: #f5f5f3;
      --ui-color: #111111;
      --accent-color: #111111;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #0c0c0c;
      --ui-color: #f0f0f0;
      --accent-color: #f0f0f0;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-color: #f5f5f3;
      --ui-color: #111111;
      --accent-color: #111111;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg-color: #0c0c0c;
        --ui-color: #f0f0f0;
        --accent-color: #f0f0f0;
      }
    }

    body {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      background: var(--bg-color);
      color: var(--ui-color);
    }

    .bg {
      fill: var(--bg-color);
    }

    #clock {
      width: min(50vw, 50vh);
      height: min(50vw, 50vh);
      display: block;
      border-radius: 50%;
    }

    .tick,
    .hand,
    .pip {
      mix-blend-mode: difference;
      fill: white;
      stroke: white;
    }

    .hand,
    .pip {
      stroke: none;
    }

    .hour-tick {
      mix-blend-mode: normal;
      stroke: var(--ui-color);
    }

    .month-dot {
      mix-blend-mode: normal;
      fill: var(--ui-color);
      stroke: none;
    }

    .date-dot {
      mix-blend-mode: difference;
      fill: white;
      stroke: none;
    }

    /* Hint the browser to promote each hand to its own compositor layer. */
    #hHand,
    #mHand,
    #sHand {
      will-change: transform;
    }

    /* ── Controls ── */
    .controls-shell {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .control-dock,
    .controls-panel {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .controls-panel {
      width: auto;
      flex-wrap: nowrap;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      transform-origin: right center;
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    .controls-panel[hidden],
    .dev-mode-control[hidden] {
      display: none;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      color: var(--ui-color);
      opacity: 0.26;
      transition:
        opacity 0.2s ease,
        background-color 0.2s ease,
        transform 0.2s ease;
      background: none;
      border: none;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      opacity: 0.72;
      outline: none;
      background: color-mix(in srgb, var(--ui-color) 8%, transparent);
    }

    .control-btn.active,
    .control-btn.ticking,
    #controlsToggle[aria-expanded="true"] {
      opacity: 0.88;
      background: color-mix(in srgb, var(--ui-color) 12%, transparent);
    }

    #themeToggle.active {
      opacity: 0.56;
      background: none;
    }

    .control-separator {
      width: 1px;
      height: 20px;
      opacity: 0.24;
      background: var(--ui-color);
    }

    .control-slider {
      width: 84px;
      height: 36px;
      flex: 0 0 84px;
      opacity: 0.28;
      transition: opacity 0.2s ease;
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent-color);
      appearance: none;
      -webkit-appearance: none;
    }

    .control-slider:hover,
    .control-slider:focus-visible {
      opacity: 0.82;
      outline: none;
    }

    .control-slider::-webkit-slider-runnable-track {
      height: 1px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ui-color) 32%, transparent);
    }

    .control-slider::-webkit-slider-thumb {
      width: 9px;
      height: 9px;
      margin-top: -4px;
      border: 0;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ui-color) 72%, transparent);
      -webkit-appearance: none;
    }

    .control-slider::-moz-range-track {
      height: 1px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ui-color) 32%, transparent);
    }

    .control-slider::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ui-color) 72%, transparent);
    }

    @media (max-width: 560px) {
      .controls-shell {
        right: 16px;
        bottom: 16px;
        gap: 4px;
      }

      .control-dock,
      .controls-panel {
        gap: 4px;
      }

      .control-btn {
        width: 32px;
        height: 32px;
      }

      .control-slider {
        width: 64px;
        flex-basis: 64px;
      }

      .control-separator {
        height: 18px;
      }
    }

  </style>
</head>

<body>

  <svg id="clock" viewBox="-1 -1 2 2">

    <rect x="-1" y="-1" width="2" height="2" class="bg" />

    <circle id="pip" cx="0" cy="0" r="0.35" class="pip" />

    <g id="minTicks" style="display:none"></g>

    <g id="ticks"></g>

    <g id="hHand"></g>
    <g id="mHand"></g>
    <g id="sHand"></g>

  </svg>

      <button class="control-btn" id="dateToggle" aria-label="Hide date marker" title="Date marker">

          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(16.36)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(32.73)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(49.09)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(65.45)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(81.82)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(98.18)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(114.55)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(130.91)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(147.27)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(163.64)"/>
          <line x1="0" y1="-0.66" x2="0" y2="-0.82" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(180)"/>

      <button class="control-btn" id="monthToggle" aria-label="Hide month marker" title="Month marker">

          <line x1="0" y1="-0.68" x2="0" y2="-0.84" stroke="currentColor" stroke-width="0.06" stroke-linecap="round"/>
          <line x1="0" y1="-0.68" x2="0" y2="-0.84" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(30)"/>
          <line x1="0" y1="-0.68" x2="0" y2="-0.84" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(60)"/>

          <line x1="0" y1="-0.68" x2="0" y2="-0.84" stroke="currentColor" stroke-width="0.06" stroke-linecap="round" transform="rotate(210)"/>

      <button class="control-btn dev-mode-control" id="randomizeBtn" aria-label="Dev mode: randomize calendar and time" title="Dev mode" hidden>

    <div class="control-dock">

        <svg width="20" height="20" viewBox="-1 -1 2 2" fill="none" aria-hidden="true">
          <line x1="-0.72" y1="-0.46" x2="0.72" y2="-0.46" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
          <line x1="-0.72" y1="0" x2="0.72" y2="0" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
          <line x1="-0.72" y1="0.46" x2="0.72" y2="0.46" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
          <circle cx="-0.26" cy="-0.46" r="0.16" fill="var(--bg-color)" stroke="currentColor" stroke-width="0.12"/>
          <circle cx="0.30" cy="0" r="0.16" fill="var(--bg-color)" stroke="currentColor" stroke-width="0.12"/>

      <button class="control-btn" id="themeToggle" aria-label="Theme: System" title="Theme"></button>

  <script>
    // ─── Design constants ──────────────────────────────────────────
    const PHI  = (1 + Math.sqrt(5)) / 2;
    let   stem = 0.005;
    let   sW, mW, hW;
    const BASE_TICK_OUTER = 0.940;
    const DIAL_OUTER_R    = 0.800;
    const DIAL_SCALE      = DIAL_OUTER_R / BASE_TICK_OUTER;
    const SECOND_LOLLIPOP_R = 0.040;
    let   testNow = null;

    function getDisplayDate() {
      return testNow ? new Date(testNow.getTime()) : new Date();
    }

    function updateWidths() {
      sW = stem;
      mW = stem * PHI * PHI;
      hW = stem * PHI * PHI * PHI * PHI;
    }

    function dialR(value) {
      return value * DIAL_SCALE;
    }

    function buildPip() {
      document.getElementById('pip').setAttribute('r', dialR(0.350).toFixed(5));
    }

    // ─── Tick marks ────────────────────────────────────────────────
    const ticksEl    = document.getElementById('ticks');
    const minTicksEl = document.getElementById('minTicks');
    const markerVisibility = {
      hour: true,
      day: true,
      date: true,
      month: true
    };
    const markerStorageKeys = {
      hour: 'showHourTicks',
      day: 'showDayMarker',
      date: 'showDateMarker',
      month: 'showMonthMarker'
    };

    function buildTicks() {
      ticksEl.innerHTML    = '';
      minTicksEl.innerHTML = '';

      const tickOuter  = DIAL_OUTER_R;
      const majorInner = dialR(0.860);
      const majorLen   = tickOuter - majorInner;
      const minorInner = tickOuter - majorLen / (PHI * PHI);
      const monthDotR  = stem * (PHI ** 3) / 2;
      const dateDotR   = stem * PHI / 2;
      const markerOrbitR = tickOuter + monthDotR + (mW * PHI);

      // ── Calendar state ────────────────────────────────────────────
      const now      = getDisplayDate();
      const curMonth = now.getMonth();  // 0–11; 0=Jan
      const curDay   = now.getDay();    // 0=Sun…6=Sat
      const curDate  = now.getDate();   // 1–31
      const showHourTicks = markerVisibility.hour;
      const showDay       = markerVisibility.day;
      const showDate      = markerVisibility.date;
      const showMonth     = markerVisibility.month;

      // Jan(0)→i=5, Feb(1)→i=10, …, Dec(11)→i=0
      const monthTickIdx = ((curMonth + 1) % 12) * 5;
      const dateTickIdx  = curDate;

      // Mon→45, Tue→50, Wed→55, Thu→0, Fri→5, Sat→10, Sun→15
      const DAY_TO_IDX = [15, 45, 50, 55, 0, 5, 10];
      const dayTickIdx = DAY_TO_IDX[curDay];

      function appendTick(target, angle, inner, outer, width, ...classes) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', ( Math.sin(angle) * inner).toFixed(5));
        line.setAttribute('y1', (-Math.cos(angle) * inner).toFixed(5));
        line.setAttribute('x2', ( Math.sin(angle) * outer).toFixed(5));
        line.setAttribute('y2', (-Math.cos(angle) * outer).toFixed(5));
        line.setAttribute('stroke-width',   width);
        line.setAttribute('stroke-linecap', 'round');
        line.classList.add('tick', ...classes);
        target.appendChild(line);
      }

      function appendDot(target, angle, radius, orbit, ...classes) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', ( Math.sin(angle) * orbit).toFixed(5));
        circle.setAttribute('cy', (-Math.cos(angle) * orbit).toFixed(5));
        circle.setAttribute('r', radius.toFixed(5));
        circle.classList.add(...classes);
        target.appendChild(circle);
      }

      // ── Hour & minute ticks ───────────────────────────────────────
      for (let i = 0; i < 60; i++) {
        const major       = (i % 5 === 0);
        const a           = i * 6 * Math.PI / 180;

        appendTick(minTicksEl, a, minorInner, tickOuter, sW);

        if (major && showHourTicks) {
          appendTick(ticksEl, a, majorInner, tickOuter, mW, 'hour-tick');
        }
      }

      if (showMonth) {
        const monthDotA = monthTickIdx * 6 * Math.PI / 180;
        appendDot(ticksEl, monthDotA, monthDotR, markerOrbitR, 'month-dot');
      }

      // ── Day of week: 7 circles on inner perimeter ────────────────
      // Ordered Mon→Sun, matching hour positions 9→3
      if (showDay) {
        const DAY_POSITIONS = [45, 50, 55, 0, 5, 10, 15];
        const dayCircleRad    = dialR(0.650);
        const dayCircleOuterR = SECOND_LOLLIPOP_R;
        const dayCircleR      = Math.max(dayCircleOuterR - (sW / 2), 0);

        for (let d = 0; d < 7; d++) {
          const idx     = DAY_POSITIONS[d];
          const a       = idx * 6 * Math.PI / 180;
          const isToday = idx === dayTickIdx;

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', ( Math.sin(a) * dayCircleRad).toFixed(5));
          circle.setAttribute('cy', (-Math.cos(a) * dayCircleRad).toFixed(5));
          circle.setAttribute('r',  dayCircleR.toFixed(5));
          circle.setAttribute('stroke-width', sW);
          if (!isToday) circle.style.fill = 'none';
          circle.classList.add('tick');
          ticksEl.appendChild(circle);
        }
      }

      if (showDate) {
        const dateDotA = dateTickIdx * 6 * Math.PI / 180;
        appendDot(ticksEl, dateDotA, dateDotR, markerOrbitR, 'date-dot');
      }
    }

    // ─── Hand builders ─────────────────────────────────────────────
    function mkRect(x, y, w, h, rx = 0) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      el.setAttribute('x', x); el.setAttribute('y', y);
      el.setAttribute('width', w); el.setAttribute('height', h);
      if (rx) el.setAttribute('rx', rx);
      el.classList.add('hand');
      return el;
    }

    function mkCircle(cx, cy, r) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', r);
      el.classList.add('hand');
      return el;
    }

    const hHandEl = document.getElementById('hHand');
    const mHandEl = document.getElementById('mHand');
    const sHandEl = document.getElementById('sHand');
    const controlsShellEl = document.querySelector('.controls-shell');
    const controlsToggleEl = document.getElementById('controlsToggle');
    const controlsPanelEl = document.getElementById('controlsPanel');
    const minToggleEl = document.getElementById('minToggle');
    const fpsToggleEl = document.getElementById('fpsToggle');
    const markerToggles = {
      hour: document.getElementById('hourToggle'),
      day: document.getElementById('dayToggle'),
      date: document.getElementById('dateToggle'),
      month: document.getElementById('monthToggle')
    };
    const markerLabels = {
      hour: 'hour ticks',
      day: 'day marker',
      date: 'date marker',
      month: 'month marker'
    };
    const randomizeBtnEl = document.getElementById('randomizeBtn');
    const themeToggleEl = document.getElementById('themeToggle');

    function buildHands() {
      hHandEl.innerHTML = '';
      mHandEl.innerHTML = '';
      sHandEl.innerHTML = '';

      hHandEl.appendChild(mkRect(-hW/2, dialR(-0.500), hW, dialR(0.570), hW/2));
      mHandEl.appendChild(mkRect(-mW/2, dialR(-0.755), mW, dialR(0.845), mW/2));
      sHandEl.appendChild(mkRect(-sW/2, dialR(-0.862), sW, dialR(0.952), sW/2));
      sHandEl.appendChild(mkCircle(0, dialR(0.210), SECOND_LOLLIPOP_R));
    }

    function renderHands(now) {
      const ms = now.getMilliseconds();
      const s  = targetFps === 30
                   ? now.getSeconds() + ms / 1000
                   : now.getSeconds();
      const m  = now.getMinutes()      + s / 60;
      const h  = (now.getHours() % 12) + m / 60;

      hHandEl.setAttribute('transform', `rotate(${(h * 30).toFixed(3)})`);
      mHandEl.setAttribute('transform', `rotate(${(m *  6).toFixed(3)})`);
      sHandEl.setAttribute('transform', `rotate(${(s *  6).toFixed(3)})`);
    }

    function randomizeDisplayDate() {
      const year     = new Date().getFullYear();
      const month    = Math.floor(Math.random() * 12);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const date     = Math.floor(Math.random() * daysInMonth) + 1;
      const hours    = Math.floor(Math.random() * 24);
      const minutes  = Math.floor(Math.random() * 60);
      const seconds  = Math.floor(Math.random() * 60);
      const millis   = Math.floor(Math.random() * 1000);

      testNow = new Date(year, month, date, hours, minutes, seconds, millis);
      startupAnim = false;
      randomizeBtnEl.classList.add('active');
      buildTicks();
      renderHands(testNow);
      lastDraw = 0;
    }

    // ─── Build ─────────────────────────────────────────────────────
    function build() {
      updateWidths();
      buildPip();
      buildTicks();
      buildHands();
    }

    // ─── Restore persisted settings ────────────────────────────────
    const slider = document.getElementById('stemSlider');

    function setControlsPanelOpen(open) {
      controlsPanelEl.hidden = !open;
      controlsToggleEl.setAttribute('aria-expanded', open);
      controlsToggleEl.setAttribute('aria-label', open ? 'Hide clock controls' : 'Show clock controls');
    }

    function setMinuteTicksVisible(visible, persist = true) {
      minTicksEl.style.display = visible ? '' : 'none';
      minToggleEl.classList.toggle('active', visible);
      minToggleEl.setAttribute('aria-label', visible ? 'Hide minute ticks' : 'Show minute ticks');
      if (persist) localStorage.setItem('minTicks', visible);
    }

    function setMarkerVisibility(name, visible, persist = true, rebuild = true) {
      markerVisibility[name] = visible;
      markerToggles[name].classList.toggle('active', visible);
      markerToggles[name].setAttribute('aria-label', `${visible ? 'Hide' : 'Show'} ${markerLabels[name]}`);
      if (persist) localStorage.setItem(markerStorageKeys[name], visible);
      if (rebuild) buildTicks();
    }

    function setDevMode(enabled) {
      randomizeBtnEl.hidden = !enabled;
    }

    window.setClockDevMode = setDevMode;
    setDevMode(true);

    const savedStem = localStorage.getItem('stem');
    if (savedStem !== null) {
      slider.value = savedStem;
      stem = savedStem / 1000;
    }

    setMinuteTicksVisible(localStorage.getItem('minTicks') === 'true', false);
    Object.keys(markerVisibility).forEach((name) => {
      setMarkerVisibility(name, localStorage.getItem(markerStorageKeys[name]) !== 'false', false, false);
    });

    build();

    // ─── Clock mode & animation loop ──────────────────────────────
    // Clock mode (continuous / ticking) is the governing factor; FPS follows.
    // On page load in ticking mode a startup sweep runs at 30 FPS, animating
    // all hands from 12:00 to their correct positions, then drops to 1 FPS.

    const ANIM_SPEED = 240;  // deg/sec during startup sweep (~1.5 s worst-case)

    let targetFps = parseInt(localStorage.getItem('fps') ?? '30', 10);
    let FRAME_MS  = 1000 / 30;  // always start at 30 FPS; may drop after sweep
    // Initialise to now so the first RAF dt is ~5–15 ms, not "time since navigation".
    let lastDraw  = performance.now();

    // Per-hand animated and target angles for startup sweep
    let startupAnim = false;
    let animS = 0, animM = 0, animH = 0;
    let animTargetS = 0, animTargetM = 0, animTargetH = 0;

    function draw(ts) {
      requestAnimationFrame(draw);

      if (ts - lastDraw < FRAME_MS) return;
      // Cap dt so a hidden-then-restored tab can't skip the animation.
      const dt = Math.min((ts - lastDraw) / 1000, 0.1);
      lastDraw = ts;

      if (startupAnim) {
        animS = Math.min(animS + ANIM_SPEED * dt, animTargetS);
        animM = Math.min(animM + ANIM_SPEED * dt, animTargetM);
        animH = Math.min(animH + ANIM_SPEED * dt, animTargetH);

        hHandEl.setAttribute('transform', `rotate(${animH.toFixed(3)})`);
        mHandEl.setAttribute('transform', `rotate(${animM.toFixed(3)})`);
        sHandEl.setAttribute('transform', `rotate(${animS.toFixed(3)})`);

        if (animS >= animTargetS && animM >= animTargetM && animH >= animTargetH) {
          startupAnim = false;
          FRAME_MS    = 1000 / targetFps;  // drop to 1 FPS
        }
        return;
      }

      renderHands(getDisplayDate());
    }

    requestAnimationFrame(draw);

    // ─── Controls ─────────────────────────────────────────────────
    controlsToggleEl.addEventListener('click', function () {
      setControlsPanelOpen(controlsToggleEl.getAttribute('aria-expanded') !== 'true');
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') setControlsPanelOpen(false);
    });

    let clickStartedInControls = false;

    document.addEventListener('pointerdown', function (event) {
      clickStartedInControls = event.target instanceof Node && controlsShellEl.contains(event.target);
    }, true);

    document.addEventListener('click', function () {
      if (!clickStartedInControls) {
        setControlsPanelOpen(false);
      }
      clickStartedInControls = false;
    });

    minToggleEl.addEventListener('click', function () {
      setMinuteTicksVisible(minTicksEl.style.display === 'none');
    });

    Object.keys(markerToggles).forEach((name) => {
      markerToggles[name].addEventListener('click', function () {
        setMarkerVisibility(name, !markerVisibility[name]);
      });
    });

    // ─── Randomize test date/time ──────────────────────────────────
    randomizeBtnEl.addEventListener('click', function () {
      randomizeDisplayDate();
    });

    // ─── FPS toggle ────────────────────────────────────────────────
    const THEME_MODES = ['system', 'light', 'dark'];

    // Continuous: full circle. Ticking: dotted circle.
    const ICON_CONTINUOUS = `<svg width="20" height="20" viewBox="-1 -1 2 2" fill="none">
      <circle cx="0" cy="0" r="0.66" stroke="currentColor" stroke-width="0.12"/>
    </svg>`;
    const ICON_TICKING = `<svg width="20" height="20" viewBox="-1 -1 2 2" fill="none">
      <circle cx="0" cy="0" r="0.66" stroke="currentColor" stroke-width="0.12" stroke-linecap="round" stroke-dasharray="0.02 0.22"/>
    </svg>`;
    const THEME_ICONS = {
      system: `<svg width="20" height="20" viewBox="-1 -1 2 2" fill="none">
        <path d="M 0 -0.70 A 0.70 0.70 0 0 0 0 0.70 L 0 -0.70 Z" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="0" r="0.70" stroke="currentColor" stroke-width="0.14"/>
        <line x1="0" y1="-0.70" x2="0" y2="0.70" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
      </svg>`,
      dark: `<svg width="20" height="20" viewBox="-1 -1 2 2" fill="none">
        <circle cx="-0.08" cy="0" r="0.68" fill="currentColor" stroke="none"/>
        <circle cx="0.22" cy="-0.04" r="0.62" fill="var(--bg-color)" stroke="none"/>
      </svg>`,
      light: `<svg width="20" height="20" viewBox="-1 -1 2 2" fill="none">
        <circle cx="0" cy="0" r="0.38" stroke="currentColor" stroke-width="0.14"/>
        <line x1="0" y1="-0.88" x2="0" y2="-0.62" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="0" y1="0.62" x2="0" y2="0.88" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="-0.88" y1="0" x2="-0.62" y2="0" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="0.62" y1="0" x2="0.88" y2="0" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="-0.62" y1="-0.62" x2="-0.44" y2="-0.44" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="0.44" y1="0.44" x2="0.62" y2="0.62" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="0.44" y1="-0.44" x2="0.62" y2="-0.62" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
        <line x1="-0.62" y1="0.62" x2="-0.44" y2="0.44" stroke="currentColor" stroke-width="0.14" stroke-linecap="round"/>
      </svg>`
    };
    let themeMode = 'system';

    function titleCase(value) {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function applyThemeMode(mode) {
      themeMode = THEME_MODES.includes(mode) ? mode : 'system';

      if (themeMode === 'system') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', themeMode);
      }

      const nextMode = THEME_MODES[(THEME_MODES.indexOf(themeMode) + 1) % THEME_MODES.length];
      themeToggleEl.innerHTML = THEME_ICONS[themeMode];
      themeToggleEl.classList.toggle('active', themeMode !== 'system');
      themeToggleEl.setAttribute('aria-label', `Theme: ${titleCase(themeMode)}. Click to switch to ${titleCase(nextMode)}.`);
      localStorage.setItem('themeMode', themeMode);
    }

    function applyFps(fps) {
      startupAnim = false;       // cancel any in-progress startup sweep
      targetFps   = fps;
      FRAME_MS    = 1000 / fps;
      fpsToggleEl.innerHTML = fps === 30 ? ICON_CONTINUOUS : ICON_TICKING;
      fpsToggleEl.classList.toggle('ticking', fps === 1);
      fpsToggleEl.setAttribute('aria-label', fps === 30 ? 'Switch to ticking mode' : 'Switch to continuous mode');
      localStorage.setItem('fps', fps);
    }

    applyThemeMode(localStorage.getItem('themeMode') ?? 'system');
    applyFps(targetFps);

    // Arm startup sweep after applyFps so it isn't immediately cancelled.
    // Also restore 30 FPS for the sweep duration — applyFps set it to 1000 ms.
    if (targetFps === 1) {
      startupAnim = true;
      FRAME_MS = 1000 / 30;
      const t  = new Date();
      const ms = t.getMilliseconds();
      const s0 = t.getSeconds() + ms / 1000;
      const m0 = t.getMinutes() + s0 / 60;
      const h0 = (t.getHours() % 12) + m0 / 60;
      animTargetS = s0 * 6;
      animTargetM = m0 * 6;
      animTargetH = h0 * 30;
    }

    fpsToggleEl.addEventListener('click', function () {
      applyFps(targetFps === 30 ? 1 : 30);
    });

    // ─── Theme toggle ──────────────────────────────────────────────
    themeToggleEl.addEventListener('click', function () {
      const nextMode = THEME_MODES[(THEME_MODES.indexOf(themeMode) + 1) % THEME_MODES.length];
      applyThemeMode(nextMode);
    });

    // ─── Stem slider ───────────────────────────────────────────────
    document.getElementById('stemSlider').addEventListener('input', function () {
      stem = this.value / 1000;
      localStorage.setItem('stem', this.value);
      build();
    });
  </script>

</body>

</html>
